name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package tarball (cargo-binstall compatible)
        run: |
          tar czf polkit-tui-agent-x86_64-unknown-linux-musl-${GITHUB_REF_NAME}.tgz \
            -C target/x86_64-unknown-linux-musl/release polkit-tui-agent

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: git-cliff/CHANGELOG.md
          files: |
            polkit-tui-agent-*.tgz
