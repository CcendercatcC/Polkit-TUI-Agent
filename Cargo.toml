[package]
name = "polkit-tui-agent"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A TUI polkit authentication agent for the terminal (ssh/tmux friendly)"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
tokio-stream = "0.1"
futures = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_polkit = { version = "5", default-features = false, features = ["tokio"] }
uzers = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
